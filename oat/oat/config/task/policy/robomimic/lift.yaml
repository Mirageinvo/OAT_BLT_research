name: lift

task_name: lift
lazy_eval: false

shape_meta: &shape_meta
  obs:
    agentview_rgb:
      shape: [84, 84, 3]
      type: rgb
    robot0_eye_in_hand_rgb:
      shape: [84, 84, 3]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      type: state
    robot0_eef_quat:
      shape: [4]
      type: state
    robot0_gripper_qpos:
      shape: [2]
      type: state
  action:
    shape: [7]

env_runner:
  _target_: oat.env_runner.robomimic_runner.RoboMimicRunner
  task_name: lift
  dataset_path: data/robomimic/hdf5_datasets/lift_mh_image.hdf5
  n_test: 50
  n_test_vis: 10
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 20
  # Sim rollouts at eval time only (n_test=50 total). Keep low on single-GPU docker.
  n_parallel_envs: 2
  image_size: 84
  camera_names:
    - agentview
    - robot0_eye_in_hand
  state_ports:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
  max_episode_steps: 400
  # Paper OAT8 (Table VI): train-time sim eval must match eval_robomimic_policy.sh
  policy_use_k_tokens: 8
  policy_entropy_threshold: 0.0

dataset:
  _target_: oat.dataset.zarr_dataset.ZarrDataset
  zarr_path: data/robomimic/lift_N${training.num_demo}.zarr
  obs_keys:
    - agentview_rgb
    - robot0_eye_in_hand_rgb
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
  action_key: action
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${horizon}
  seed: ${seed}
  val_ratio: 0.1
